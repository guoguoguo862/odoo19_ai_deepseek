<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="630" viewBox="0 0 1400 630">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#7890a2"/></marker></defs>
<rect width="100%" height="100%" fill="#f4f8fb"/>
<text x="700" y="48" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="30" fill="#16324F">从一句需求到真实购物车</text>
<text x="700" y="84" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#587184">AI 负责理解与选择下一步；业务成功以工具结果和购物车实际数据为准</text>
<path d="M315,235 L375,235" fill="none" stroke="#7890a2" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M655,235 L715,235" fill="none" stroke="#7890a2" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M995,235 L1055,235" fill="none" stroke="#7890a2" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M855,315 L855,420" fill="none" stroke="#7890a2" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M1210,315 L1210,420" fill="none" stroke="#7890a2" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="35" y="160" width="280" height="155" rx="16" fill="white" stroke="#16324F" stroke-width="2"/>
<text x="175" y="203" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="25" fill="#16324F">01  表达需求</text>
<text x="175" y="242" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#16324F">一个黑色抽屉</text>
<text x="175" y="273" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#16324F">保留商品与数量 1</text>
<rect x="375" y="160" width="280" height="155" rx="16" fill="white" stroke="#087F8C" stroke-width="2"/>
<text x="515" y="203" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="25" fill="#087F8C">02  查询真实目录</text>
<text x="515" y="242" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#16324F">已发布 / 可售 / 当前网站</text>
<text x="515" y="273" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#16324F">返回 SKU 和实际规格</text>
<rect x="715" y="160" width="280" height="155" rx="16" fill="white" stroke="#087F8C" stroke-width="2"/>
<text x="855" y="203" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="25" fill="#087F8C">03  判断具体商品</text>
<text x="855" y="242" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#16324F">唯一 → 继续</text>
<text x="855" y="273" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#16324F">有歧义 → 询问缺少规格</text>
<rect x="1055" y="160" width="310" height="155" rx="16" fill="white" stroke="#16324F" stroke-width="2"/>
<text x="1210" y="203" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="25" fill="#16324F">04  校验并执行加购</text>
<text x="1210" y="242" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#16324F">整批预校验 + savepoint</text>
<text x="1210" y="273" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#16324F">返回实际增加数量</text>
<rect x="715" y="420" width="280" height="155" rx="16" fill="white" stroke="#AA7217" stroke-width="2"/>
<text x="855" y="463" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="25" fill="#AA7217">客户补充规格</text>
<text x="855" y="502" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#16324F">基于真实候选回答</text>
<text x="855" y="533" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#16324F">再确认匹配是否唯一</text>
<rect x="1055" y="420" width="310" height="155" rx="16" fill="white" stroke="#AA7217" stroke-width="2"/>
<text x="1210" y="463" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="25" fill="#AA7217">05  核对并结账</text>
<text x="1210" y="502" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#16324F">打开 /shop/cart</text>
<text x="1210" y="533" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#16324F">使用标准网站结账流程</text>
</svg>